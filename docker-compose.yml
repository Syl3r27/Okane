
services:
  postgres:
    image: postgres:16
    container_name: okane_postgres
    environment:
      POSTGRES_USER: okane
      POSTGRES_PASSWORD: okane
      POSTGRES_DB: okane_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okane_user -d okane_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: okane_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://okane:okane@postgres:5432/okane_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: node dist/index.js
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://okane:okane@postgres:5432/okane_db
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      MAX_JOB_RETRIES: 3
      BACKOFF_BASE_DELAY_MS: 1000
      IDEMPOTENCY_TTL_SECONDS: 86400
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: node dist/workers/payment.worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://okane:okane@postgres:5432/okane_db
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      MAX_JOB_RETRIES: 3
      BACKOFF_BASE_DELAY_MS: 1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy